<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>Corcomm Blacklist</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect x='2' y='2' width='28' height='28' rx='5' fill='%237A1F2B'/%3E%3Ctext x='16' y='22' font-family='Arial' font-weight='700' font-size='15' fill='white' text-anchor='middle'%3EBL%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
html{color-scheme:light;-webkit-text-size-adjust:100%}
body{margin:0}
img{max-width:100%}
[hidden]{display:none!important}
/* Layout: sticky ledger header (wordmark · tabs · entity switch), one working column below; tables are the main surface. */
:root{
  --bg:#F2F4F6; --surface:#FFFFFF; --surface-2:#E9EDF1; --ink:#14202B; --muted:#5A6774; --line:#D3DAE1;
  --accent:#7A1F2B; --accent-ink:#FFFFFF; --accent-soft:#F4E4E6;
  --ce:#1B6A88; --ce-soft:#E1EFF5; --cs:#9A5F0E; --cs-soft:#F6ECDC;
  --good:#2C7A4C; --good-soft:#E2F2E8; --warn:#B4531A; --warn-soft:#FBEADF; --bad:#B42318;
  --scrim:rgba(14,22,30,.45); --shadow:0 10px 30px rgba(14,22,30,.14);
  --f-display:"Barlow Condensed","Arial Narrow",Arial,sans-serif;
  --f-body:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0E141A; --surface:#151D25; --surface-2:#1D2731; --ink:#E4E9EE; --muted:#93A0AD; --line:#2A3540;
  --accent:#E07280; --accent-ink:#1B0C0F; --accent-soft:#3A1E23;
  --ce:#62B6D8; --ce-soft:#16303B; --cs:#E2A852; --cs-soft:#372A16;
  --good:#63C690; --good-soft:#173123; --warn:#F2945A; --warn-soft:#3A2416; --bad:#F2766C;
  --scrim:rgba(0,0,0,.6); --shadow:0 10px 30px rgba(0,0,0,.5); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0E141A; --surface:#151D25; --surface-2:#1D2731; --ink:#E4E9EE; --muted:#93A0AD; --line:#2A3540;
  --accent:#E07280; --accent-ink:#1B0C0F; --accent-soft:#3A1E23;
  --ce:#62B6D8; --ce-soft:#16303B; --cs:#E2A852; --cs-soft:#372A16;
  --good:#63C690; --good-soft:#173123; --warn:#F2945A; --warn-soft:#3A2416; --bad:#F2766C;
  --scrim:rgba(0,0,0,.6); --shadow:0 10px 30px rgba(0,0,0,.5); color-scheme:dark}

*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:14px;line-height:1.5}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--surface)}
.wrap{max-width:1240px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
h1,h2,h3{font-family:var(--f-display);font-weight:700;letter-spacing:.01em;text-wrap:balance;margin:0;line-height:1.1}
h1{font-size:30px} h2{font-size:22px} h3{font-size:18px}
.num,.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}
.label{font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:600}
a{color:var(--accent)}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

/* Header */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--surface);border-bottom:1px solid var(--line)}
.top-row{display:flex;align-items:center;gap:16px;flex-wrap:wrap;padding-block:10px}
.mark{display:flex;align-items:center;gap:10px;margin-right:auto}
.stamp{font-family:var(--f-display);font-weight:700;font-size:13px;letter-spacing:.14em;color:var(--accent);border:2px solid var(--accent);padding:2px 7px;border-radius:3px;transform:rotate(-3deg)}
.mark-name{font-family:var(--f-display);font-weight:700;font-size:22px;letter-spacing:.02em}
.mark-name span{color:var(--muted);font-weight:600}
.who{display:flex;align-items:center;gap:10px;font-size:13px}
.tabs-row{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;flex-wrap:wrap}
.tabs{display:flex;gap:2px;overflow-x:auto;scrollbar-width:none}
.tab{background:none;border:0;padding:10px 14px;border-bottom:3px solid transparent;cursor:pointer;color:var(--muted);font-weight:500;white-space:nowrap}
.tab[aria-current="page"]{color:var(--ink);border-bottom-color:var(--accent);font-weight:600}
.tab:hover{color:var(--ink)}
.seg{display:inline-flex;background:var(--surface-2);border-radius:8px;padding:3px;gap:2px;margin-bottom:6px}
.seg button{border:0;background:none;padding:5px 12px;border-radius:6px;cursor:pointer;color:var(--muted);font-size:13px;font-weight:500;display:inline-flex;align-items:center;gap:6px}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.12)}

main{padding-block:24px 64px;display:grid;gap:20px}
.page-head{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;flex-wrap:wrap}
.page-head p{margin:4px 0 0}

/* Buttons */
.btn{display:inline-flex;align-items:center;gap:6px;border-radius:6px;padding:8px 14px;font-weight:600;font-size:13.5px;cursor:pointer;border:1px solid var(--line);background:var(--surface);color:var(--ink);white-space:nowrap}
.btn:hover{border-color:var(--muted)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.primary:hover{filter:brightness(1.08)}
.btn.ghost{background:none;border-color:transparent;color:var(--muted);padding:6px 8px}
.btn.ghost:hover{color:var(--ink);background:var(--surface-2)}
.btn.danger{color:var(--bad);border-color:var(--bad);background:none}
.btn.sm{padding:5px 10px;font-size:12.5px}
.btn[disabled]{opacity:.5;cursor:not-allowed}
.btn-row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}

/* Surfaces */
.panel{background:var(--surface);border:1px solid var(--line);border-radius:10px}
.panel-head{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:14px 16px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.panel-body{padding:16px}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,420px),1fr));gap:20px}
.grid2>*{min-width:0}

/* Entity marks */
.ent{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:600;padding:2px 8px;border-radius:999px;white-space:nowrap}
.ent::before{content:"";width:7px;height:7px;border-radius:50%;background:currentColor}
.ent.CE{color:var(--ce);background:var(--ce-soft)} .ent.CS{color:var(--cs);background:var(--cs-soft)}
.dot{width:8px;height:8px;border-radius:50%;display:inline-block}
.dot.CE{background:var(--ce)} .dot.CS{background:var(--cs)}

/* Status chips */
.chip{display:inline-block;font-size:11.5px;font-weight:600;padding:2px 8px;border-radius:4px;background:var(--surface-2);color:var(--muted);white-space:nowrap}
.chip.open{background:var(--warn-soft);color:var(--warn)}
.chip.done{background:var(--good-soft);color:var(--good)}
.chip.off{background:var(--surface-2);color:var(--muted);text-decoration:line-through}
.chip.lock{background:none;padding:0;color:var(--muted);font-weight:500}

/* Entity scorecards */
.score{padding:18px;display:grid;gap:14px}
.score-head{display:flex;align-items:center;gap:10px;justify-content:space-between}
.score-head h3{display:flex;align-items:center;gap:8px}
.figs{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.fig .v{font-family:var(--f-mono);font-size:17px;font-weight:500;font-variant-numeric:tabular-nums;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.fig .v.big{font-size:20px}
@media (max-width:520px){.figs{grid-template-columns:1fr 1fr}}
.bar{height:8px;background:var(--surface-2);border-radius:999px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--good);border-radius:999px}
.bar.CE i{background:var(--ce)} .bar.CS i{background:var(--cs)}
.bar-row{display:flex;align-items:center;gap:10px;font-size:12.5px}
.bar-row .bar{flex:1}
.mini-bar{width:70px;height:6px}

/* Tables */
.tbl-wrap{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:13.5px}
th{font-size:11px;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);font-weight:600;text-align:left;padding:10px 12px;border-bottom:1px solid var(--line);white-space:nowrap;background:var(--surface)}
td{padding:10px 12px;border-bottom:1px solid var(--line);vertical-align:top}
tbody tr:last-child td{border-bottom:0}
td.r,th.r{text-align:right}
td.num{white-space:nowrap}
tr.click{cursor:pointer}
tr.click:hover td{background:var(--surface-2)}
tfoot td{font-weight:600;border-top:2px solid var(--line);border-bottom:0}
.cell-main{font-weight:600}
.cell-sub{font-size:12px;color:var(--muted)}
.neg{color:var(--good)}

/* Toolbars & forms */
.toolbar{display:flex;gap:10px;flex-wrap:wrap;align-items:flex-end}
.field{display:grid;gap:5px;min-width:0}
.field>span{font-size:12.5px;font-weight:600}
.field small{color:var(--muted);font-size:12px}
input[type=text],input[type=password],input[type=number],input[type=date],input[type=email],input[type=search],select,textarea{width:100%;background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:8px 10px;min-height:38px}
textarea{min-height:70px;resize:vertical}
input:focus,select:focus,textarea:focus{border-color:var(--accent);outline:none;box-shadow:0 0 0 3px var(--accent-soft)}
.form-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
.form-grid .full{grid-column:1/-1}
@media (max-width:560px){.form-grid{grid-template-columns:1fr}}
.locked{display:flex;align-items:center;gap:8px;background:var(--surface-2);border:1px dashed var(--line);border-radius:6px;padding:8px 10px;min-height:38px;font-family:var(--f-mono);font-size:13px}
.locked svg{flex:none;color:var(--muted)}
.pick{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.pick label{display:flex;align-items:center;gap:10px;border:1px solid var(--line);border-radius:8px;padding:10px 12px;cursor:pointer;font-weight:600}
.pick input{accent-color:var(--accent)}
.pick label:has(input:checked){border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.err{color:var(--bad);font-size:13px;min-height:1em}
.note{font-size:12.5px;color:var(--muted)}

/* Matter cards */
.matter{border:1px solid var(--line);border-radius:10px;background:var(--surface)}
.matter-head{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;padding:14px 16px;border-bottom:1px solid var(--line)}
.matter-head .ref{font-weight:600;font-size:15px}
.kv{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px 18px;padding:14px 16px}
.kv div{min-width:0}
.kv .v{font-size:13.5px;overflow-wrap:anywhere}
.docs{padding:0 16px 14px;display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.doc{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);border-radius:6px;padding:4px 8px;font-size:12.5px;max-width:100%;background:var(--surface-2)}
.doc a{color:var(--ink);text-decoration:none;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:240px}
.doc a:hover{text-decoration:underline}
.doc button{border:0;background:none;color:var(--muted);cursor:pointer;padding:0 2px;font-size:14px;line-height:1}

/* Customer header */
.cust-head{display:grid;gap:14px;padding:18px}
.cust-meta{display:flex;flex-wrap:wrap;gap:6px 22px;font-size:13px}
.cust-meta b{font-weight:500;color:var(--muted);margin-right:4px}

/* Lists */
.feed{display:grid}
.feed-item{display:grid;grid-template-columns:auto 1fr auto;gap:12px;padding:10px 16px;border-bottom:1px solid var(--line);align-items:start}
.feed-item:last-child{border-bottom:0}
.feed-item .t{font-size:13.5px}
.feed-item .s{font-size:12px;color:var(--muted)}
.ic{width:28px;height:28px;border-radius:6px;display:grid;place-items:center;font-size:13px;font-weight:700;font-family:var(--f-mono)}
.ic.in{background:var(--accent-soft);color:var(--accent)}
.ic.pay{background:var(--good-soft);color:var(--good)}
.empty{padding:40px 20px;text-align:center;display:grid;gap:10px;justify-items:center}
.empty p{margin:0;max-width:46ch;color:var(--muted)}

/* Auth */
.auth{min-height:100vh;display:grid;place-items:center;padding-block:40px}
.auth-card{width:min(420px,100%);background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:28px;display:grid;gap:18px;box-shadow:var(--shadow)}
.auth-card .mark{margin:0}
.auth-card form{display:grid;gap:14px}

/* Modal */
.scrim{position:fixed;inset:0;background:var(--scrim);z-index:50;display:grid;place-items:start center;overflow-y:auto;padding:max(24px,env(safe-area-inset-top,0px)) max(12px,env(safe-area-inset-right,0px)) max(24px,env(safe-area-inset-bottom,0px)) max(12px,env(safe-area-inset-left,0px))}
.modal{width:min(640px,100%);background:var(--surface);border-radius:12px;box-shadow:var(--shadow);display:grid}
.modal-head{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:16px 20px;border-bottom:1px solid var(--line)}
.modal-body{padding:20px;display:grid;gap:14px}
.modal-foot{display:flex;justify-content:flex-end;gap:8px;padding:14px 20px;border-top:1px solid var(--line);flex-wrap:wrap}

.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(20px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:8px;z-index:60;font-size:13.5px;box-shadow:var(--shadow);max-width:calc(100% - 32px)}
.toast.bad{background:var(--bad);color:#fff}
.banner{background:var(--warn-soft);color:var(--warn);border-radius:8px;padding:10px 14px;font-size:13.5px}
.spin{width:22px;height:22px;border:3px solid var(--line);border-top-color:var(--accent);border-radius:50%;animation:sp 0.8s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){.spin{animation:none}}
.section-title{display:flex;align-items:baseline;justify-content:space-between;gap:10px;flex-wrap:wrap}
.hide-sm{} @media (max-width:640px){.hide-sm{display:none}}

.linkbtn{background:none;border:0;padding:0;color:var(--ink);cursor:pointer;text-align:left;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:240px;font-size:12.5px}
.linkbtn:hover{text-decoration:underline}
</style>
</head>
<body>
<div id="app"><div class="auth"><div class="spin" aria-label="Loading"></div></div></div>
<div id="modal-root"></div>
<div id="toast-root"></div>

<script src="firebase-config.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.8.2/jspdf.plugin.autotable.min.js"></script>
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getAuth, setPersistence, browserSessionPersistence, onAuthStateChanged, signInWithEmailAndPassword, createUserWithEmailAndPassword, signOut, sendPasswordResetEmail, updatePassword, reauthenticateWithCredential, EmailAuthProvider } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
import { getFirestore, collection, doc, setDoc, updateDoc, deleteDoc, getDoc, onSnapshot, query, orderBy, limit, serverTimestamp, writeBatch } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";
import { getStorage, ref as sref, uploadBytes, getDownloadURL, deleteObject } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-storage.js";

/* ---------- constants ---------- */
const ENT = {
  CE: { name: "Corcomm Elektronies", short: "Elektronies" },
  CS: { name: "Corcomm Sekuriteit", short: "Sekuriteit" },
};
const ATT = ["Sadler Inc", "Du Randt & Louw"];
const STATUSES = ["Handed over", "Letter of demand", "Summons issued", "Judgment obtained", "Paying (arrangement)", "Paid in full", "Written off", "Closed"];
const CLOSED = ["Paid in full", "Written off", "Closed"];
const MON = ["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
const FILE_TYPES = { pdf: "application/pdf", jpg: "image/jpeg", jpeg: "image/jpeg", png: "image/png", webp: "image/webp" };
const LOCK_SVG = '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><rect x="4" y="11" width="16" height="10" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/></svg>';
const TS_FIELDS = ["txDate", "createdAt", "at"];

/* ---------- state ---------- */
const S = {
  phase: "loading", authMsg: "", settingUp: false,
  loaded: { users: false, customers: false, transactions: false, payments: false },
  users: [], customers: [], txs: [], pays: [], activity: [],
  me: null, view: "overview", entity: "ALL", custId: null,
  q: "", custFilter: "open", payQ: "", err: null, ver: 0,
  rep: null,
};
S.rep = { from: new Date().getFullYear() + "-01-01", to: localYMD(), attorney: "ALL", idle: false };
try { const e = localStorage.getItem("cbl_entity"); if (e === "CE" || e === "CS" || e === "ALL") S.entity = e; } catch {}

/* ---------- firebase ---------- */
const CFG = window.FIREBASE_CONFIG;
const configured = !!(CFG && CFG.apiKey && !/PASTE/i.test(CFG.apiKey) && CFG.projectId && CFG.projectId !== "your-project");
let app, auth, db, storage;
if (configured) {
  app = initializeApp(CFG);
  auth = getAuth(app);
  db = getFirestore(app);
  storage = getStorage(app);
}

/* ---------- helpers ---------- */
function esc(s) { return String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c])); }
function localYMD(d = new Date()) { return d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0") + "-" + String(d.getDate()).padStart(2, "0"); }
function ymdOf(v) { if (!v) return ""; return v.length === 10 ? v : localYMD(new Date(v)); }
function fmtDate(v) { const y = ymdOf(v); if (!y) return "—"; const [a, b, c] = y.split("-"); return +c + " " + MON[+b - 1] + " " + a; }
function fmtTime(iso) { if (!iso) return ""; const d = new Date(iso); return String(d.getHours()).padStart(2, "0") + ":" + String(d.getMinutes()).padStart(2, "0"); }
function round2(n) { return Math.round((+n || 0) * 100) / 100; }
function money(n, sep = " ") {
  n = round2(n); const neg = n < 0; const [i, d] = Math.abs(n).toFixed(2).split(".");
  return (neg ? "-" : "") + "R" + sep + i.replace(/\B(?=(\d{3})+(?!\d))/g, sep) + "." + d;
}
function pct(a, b) { return b > 0 ? Math.max(0, Math.min(100, (a / b) * 100)) : 0; }
function nowISO() { return new Date().toISOString(); }
function credit(p) { return round2((+p.amount || 0) + (+p.fees || 0)); }
function fileSize(b) { return b > 1048576 ? (b / 1048576).toFixed(1) + " MB" : Math.max(1, Math.round(b / 1024)) + " KB"; }
const isAdmin = () => S.me?.role === "admin";
const inEnt = code => S.entity === "ALL" || code === S.entity;
function entChip(code) { return code ? `<span class="ent ${code}">${esc(ENT[code]?.short || code)}</span>` : ""; }
function statusChip(st) {
  const cls = st === "Paid in full" ? "done" : st === "Written off" || st === "Closed" ? "off" : "open";
  return `<span class="chip ${cls}">${esc(st)}</span>`;
}
function conv(d) {
  const o = { id: d.id, ...d.data({ serverTimestamps: "estimate" }) };
  TS_FIELDS.forEach(k => { if (o[k] && typeof o[k].toDate === "function") o[k] = o[k].toDate().toISOString(); });
  return o;
}

/* ---------- derived model ---------- */
let M = null, Mver = -1;
function model() {
  if (Mver === S.ver && M) return M;
  const custById = {}, txById = {}, txByCust = {}, payByTx = {}, payByCust = {}, userById = {};
  S.users.forEach(u => userById[u.id] = u);
  S.customers.forEach(c => { custById[c.id] = c; txByCust[c.id] = []; payByCust[c.id] = []; });
  S.txs.forEach(t => { txById[t.id] = t; (txByCust[t.customerId] ||= []).push(t); payByTx[t.id] = []; });
  S.pays.forEach(p => { (payByTx[p.transactionId] ||= []).push(p); (payByCust[p.customerId] ||= []).push(p); });
  const txStats = {};
  S.txs.forEach(t => {
    const paid = round2((payByTx[t.id] || []).reduce((a, p) => a + credit(p), 0));
    txStats[t.id] = { paid, balance: round2((+t.amount || 0) - paid) };
  });
  const custStats = {};
  S.customers.forEach(c => {
    const txs = txByCust[c.id] || [], pays = payByCust[c.id] || [];
    const handed = round2(txs.reduce((a, t) => a + (+t.amount || 0), 0));
    const rec = round2(pays.reduce((a, p) => a + credit(p), 0));
    const dates = [...txs.map(t => ymdOf(t.txDate)), ...pays.map(p => p.dateReceived)].filter(Boolean).sort();
    const open = txs.filter(t => !CLOSED.includes(t.status)).length;
    const atts = [...new Set(txs.map(t => t.attorney).filter(Boolean))];
    custStats[c.id] = { handed, rec, balance: round2(handed - rec), last: dates[dates.length - 1] || "", open, count: txs.length, atts };
  });
  M = { custById, txById, txByCust, payByTx, payByCust, userById, txStats, custStats };
  Mver = S.ver;
  return M;
}

function writeFailed(e) {
  console.error(e);
  if (e?.code === "permission-denied") return "You don't have permission to make this change. Your login may have been disabled, or only an administrator can do this.";
  if (e?.code === "unavailable") return "No connection. Check your internet and try again.";
  return "Couldn't save. Check your connection and try again.";
}
function authErr(e) {
  const c = e?.code || "";
  if (c.includes("invalid-credential") || c.includes("wrong-password") || c.includes("user-not-found") || c.includes("invalid-email")) return "Email or password is incorrect.";
  if (c.includes("too-many-requests")) return "Too many attempts. Wait a few minutes, or reset your password.";
  if (c.includes("email-already-in-use")) return "That email address already has a login.";
  if (c.includes("weak-password")) return "Choose a stronger password (at least 8 characters).";
  if (c.includes("network")) return "No connection. Check your internet and try again.";
  if (c.includes("operation-not-allowed")) return "Email/password sign-in isn't switched on in Firebase yet (see the setup guide, step 3).";
  console.error(e); return "Something went wrong. Try again.";
}

/* ---------- data writes ---------- */
async function put(col, id, data) { const r = id ? doc(db, col, id) : doc(collection(db, col)); await setDoc(r, data); return r.id; }
async function patch(col, id, data) { await updateDoc(doc(db, col, id), data); }
async function remove(col, id) { await deleteDoc(doc(db, col, id)); }
async function log(action, text, extra = {}) {
  try { await put("activity", null, { at: serverTimestamp(), by: S.me?.id || "", byName: S.me?.name || "", action, text, ...extra }); } catch (e) { console.warn(e); }
}
function safeName(n) { return n.replace(/[^A-Za-z0-9._-]+/g, "_").slice(-120); }
async function uploadFiles(files, txId) {
  for (const f of files) {
    const ext = (f.name.split(".").pop() || "").toLowerCase();
    if (!FILE_TYPES[ext]) throw { code: "type", message: `"${f.name}" isn't a PDF or image. Save it as PDF first, then upload.` };
    if (f.size > 20 * 1048576) throw { code: "size", message: `"${f.name}" is larger than 20 MB.` };
  }
  const out = [];
  for (const f of files) {
    const type = FILE_TYPES[(f.name.split(".").pop() || "").toLowerCase()];
    const path = `documents/${txId}/${Date.now()}-${safeName(f.name)}`;
    await uploadBytes(sref(storage, path), f, { contentType: type });
    out.push({ path, name: f.name, type, size: f.size, at: nowISO(), by: S.me.id });
  }
  return out;
}
function uploadErr(e) {
  if (e?.message && (e.code === "type" || e.code === "size")) return e.message;
  if (e?.code === "storage/unauthorized") return "You don't have permission to upload documents.";
  if (e?.code === "storage/quota-exceeded") return "Document storage is full.";
  if (e?.code === "storage/no-default-bucket" || e?.code === "storage/unknown") return "Document storage isn't set up in Firebase yet (see the setup guide, step 5).";
  console.error(e); return "The document couldn't be uploaded. Try again.";
}

  return { handed: round2(handed), rec: round2(rec), bal: round2(handed - rec), open, custs };
}

function payTable(pays, m, withCust) {
  const tot = pays.reduce((a, p) => { a.n += +p.amount || 0; a.f += +p.fees || 0; return a; }, { n: 0, f: 0 });
  return `<div class="tbl-wrap"><table><thead><tr><th>Date received</th>${withCust ? "<th>Customer</th>" : ""}<th>Matter</th><th>Attorney</th><th>Reference</th><th class="r">Paid over (net)</th><th class="r">Attorney fees</th><th class="r">Credited</th><th>Captured</th>${isAdmin() ? "<th></th>" : ""}</tr></thead>
  <tbody>${pays.map(p => { const t = m.txById[p.transactionId], c = m.custById[p.customerId]; return `<tr>
    <td style="white-space:nowrap">${fmtDate(p.dateReceived)}</td>
    ${withCust ? `<td><a href="#" data-act="openCust" data-id="${p.customerId}" style="color:var(--ink);font-weight:600">${esc(c?.name || "—")}</a><div class="cell-sub">${entChip(c?.entity)}</div></td>` : ""}
    <td>${esc(t?.reference || "—")}</td><td>${esc(t?.attorney || "—")}</td><td>${esc(p.reference || "—")}${p.notes ? `<div class="cell-sub">${esc(p.notes)}</div>` : ""}</td>
    <td class="r num">${money(p.amount)}</td><td class="r num">${money(p.fees || 0)}</td><td class="r num" style="font-weight:600">${money(credit(p))}</td>
    <td class="cell-sub" style="white-space:nowrap">${esc(userName(p.createdBy, p.createdByName))}<br>${fmtDate(p.createdAt)}</td>
    ${isAdmin() ? `<td><button class="btn ghost sm" data-act="delPay" data-id="${p.id}" aria-label="Delete payment">Delete</button></td>` : ""}</tr>`; }).join("")}</tbody>
  <tfoot><tr><td colspan="${withCust ? 5 : 4}">Total</td><td class="r num">${money(tot.n)}</td><td class="r num">${money(tot.f)}</td><td class="r num">${money(tot.n + tot.f)}</td><td colspan="${isAdmin() ? 2 : 1}"></td></tr></tfoot></table></div>`;
}

function paymentsView() {

  let pays = S.pays.filter(p => { const c = m.custById[p.customerId]; return c && inEnt(c.entity); });

/* ---------- report engine ---------- */
function buildReport() {
  const m = model(), { from, to, attorney, idle } = S.rep;
  const codes = S.entity === "ALL" ? ["CE", "CS"] : [S.entity];
  const out = { codes, from, to, attorney, ents: {}, movements: [], byAtt: {} };
  ATT.forEach(a => out.byAtt[a] = { handed: 0, rec: 0, close: 0 });
  codes.forEach(code => {
    const rows = []; const tot = { open: 0, handed: 0, rec: 0, fees: 0, close: 0, toDate: 0, recToDate: 0 };
    S.customers.filter(c => c.entity === code).forEach(c => {
      const txs = (m.txByCust[c.id] || []).filter(t => attorney === "ALL" || t.attorney === attorney);
      if (!txs.length) return;
      const txIds = new Set(txs.map(t => t.id));
      const pays = (m.payByCust[c.id] || []).filter(p => txIds.has(p.transactionId));
      let open = 0, handed = 0, rec = 0, fees = 0, toDate = 0, recToDate = 0, last = "";
      txs.forEach(t => {
        const d = ymdOf(t.txDate), a = +t.amount || 0;
        if (d > to) return;
        toDate += a; if (d < from) open += a; else handed += a;
        if (d > last) last = d;
        if (d >= from) { out.movements.push({ date: d, at: t.txDate, code, cust: c, type: "Handed over", att: t.attorney, ref: t.reference, attRef: t.attorneyRef, debit: a, credit: 0, fees: 0, net: 0 }); out.byAtt[t.attorney] && (out.byAtt[t.attorney].handed += a); }
        out.byAtt[t.attorney] && (out.byAtt[t.attorney].close += a);
      });
      pays.forEach(p => {
        const d = p.dateReceived, cr = credit(p), t = m.txById[p.transactionId];
        if (d > to) return;
        recToDate += cr; if (d < from) open -= cr; else { rec += cr; fees += +p.fees || 0; }
        if (d > last) last = d;
        if (d >= from) { out.movements.push({ date: d, at: p.createdAt, code, cust: c, type: "Payment received", att: t?.attorney, ref: p.reference || t?.reference, attRef: t?.attorneyRef, debit: 0, credit: cr, fees: +p.fees || 0, net: +p.amount || 0 }); t && out.byAtt[t.attorney] && (out.byAtt[t.attorney].rec += cr); }
        t && out.byAtt[t.attorney] && (out.byAtt[t.attorney].close -= cr);
      });
      open = round2(open); handed = round2(handed); rec = round2(rec);
      const close = round2(open + handed - rec);
      const moved = handed || rec;
      if (!idle && !moved && Math.abs(close) < 0.005) return;
      if (!toDate) return;
      const openMatters = txs.filter(t => ymdOf(t.txDate) <= to && !CLOSED.includes(t.status)).length;
      rows.push({ c, open, handed, rec, fees: round2(fees), close, toDate: round2(toDate), recToDate: round2(recToDate), pct: pct(recToDate, toDate), last, atts: [...new Set(txs.map(t => t.attorney))].join(", "), status: openMatters ? `${openMatters} open` : "Settled" });
      tot.open += open; tot.handed += handed; tot.rec += rec; tot.fees += fees; tot.close += close; tot.toDate += toDate; tot.recToDate += recToDate;
    });
    rows.sort((a, b) => b.close - a.close || a.c.name.localeCompare(b.c.name));
    Object.keys(tot).forEach(k => tot[k] = round2(tot[k]));
    out.ents[code] = { rows, tot };
  });
  out.movements.sort((a, b) => a.date.localeCompare(b.date) || (a.at || "").localeCompare(b.at || ""));
  Object.values(out.byAtt).forEach(v => { v.handed = round2(v.handed); v.rec = round2(v.rec); v.close = round2(v.close); });
  return out;
}

/* ---------- customer import (CSV) ---------- */
const IMP_GROUPS = [
  { key: "ELE", label: "ELE… account codes", def: "CE" },
  { key: "SEK", label: "SEK… account codes", def: "CS" },
  { key: "SIG", label: "SIG… account codes", def: "" },
  { key: "OTHER", label: "Other account codes", def: "" },
];
let IMP = null;
function impGroup(acc) {
  const a = acc.toUpperCase();
  if (a.startsWith("ELE")) return "ELE";
  if (a.startsWith("SEK")) return "SEK";
  if (a.startsWith("SIG") || a.startsWith("SSIG")) return "SIG";
  return "OTHER";
}
function parseCSV(text) {
  const rows = []; let row = [], f = "", q = false;
  for (let i = 0; i < text.length; i++) {
    const c = text[i];
    if (q) { if (c === '"') { if (text[i + 1] === '"') { f += '"'; i++; } else q = false; } else f += c; }
    else if (c === '"') q = true;
    else if (c === ",") { row.push(f); f = ""; }
    else if (c === "\n") { row.push(f); rows.push(row); row = []; f = ""; }
    else if (c !== "\r") f += c;
  }
  if (f || row.length) { row.push(f); rows.push(row); }
  return rows.filter(r => r.some(c => c.trim()));
}
function decodeText(buf) {
  try { return new TextDecoder("utf-8", { fatal: true }).decode(buf).replace(/^﻿/, ""); }
  catch { return new TextDecoder("windows-1252").decode(buf); }
}
function normPhone(p) {
  p = (p || "").replace(/\s+/g, " ").trim(); if (!p) return "";
  const d = p.replace(/[\s-]/g, "");
  const n = /^\d{9}$/.test(d) ? "0" + d : /^0\d{9}$/.test(d) ? d : null;
  return n ? `${n.slice(0, 3)} ${n.slice(3, 6)} ${n.slice(6)}` : p;
}
function readCustomerCSV(text) {
  const rows = parseCSV(text);
  if (rows.length < 2) throw new Error("The file has no customer rows.");
  const h = rows[0].map(x => x.trim().toLowerCase());
  const find = re => h.findIndex(x => re.test(x));
  const iAcc = find(/^(account( number| no\.?)?|acc(ount)? ?no\.?|code)$/), iName = find(/^(description|name|customer( name)?)$/), iTel = find(/^(telephone|tel|phone|cell( ?phone)?)$/);
  const iAddr = h.map((x, i) => /^address/.test(x) ? i : -1).filter(i => i >= 0);
  if (iAcc < 0 || iName < 0) throw new Error("The file needs an \"Account Number\" and a \"Description\" (or \"Name\") column.");
  return rows.slice(1).map(r => ({
    accountNo: (r[iAcc] || "").trim(),
    name: (r[iName] || "").replace(/\s+/g, " ").trim(),
    address: iAddr.map(i => (r[i] || "").replace(/\s+/g, " ").trim()).filter(Boolean).join(", "),
    phone: iTel >= 0 ? normPhone(r[iTel]) : "",
  })).filter(x => x.name || x.accountNo);
}
function importBody() {
  if (!IMP) return `<div class="modal-body">
      <p style="margin:0">Choose a CSV file with an <b>Account Number</b> and <b>Description</b> column, such as a customer list exported from Sage. Address and telephone columns are picked up too.</p>
      <label class="field"><span>Customer file (.csv)</span><input id="imp-file" type="file" accept=".csv,text/csv" data-import-file></label>
      <div class="err"></div></div>
    <div class="modal-foot"><button class="btn" type="button" data-act="closeModal">Cancel</button></div>`;
  const existing = new Set(S.customers.map(c => (c.accountNo || "").trim().toUpperCase()).filter(Boolean));
  const fresh = IMP.rows.filter(r => !r.accountNo || !existing.has(r.accountNo.toUpperCase()));
  const skipped = IMP.rows.length - fresh.length;
  const groups = IMP_GROUPS.map(g => ({ ...g, rows: fresh.filter(r => impGroup(r.accountNo) === g.key) })).filter(g => g.rows.length);
  const ready = groups.every(g => IMP.map[g.key]);
  const count = groups.reduce((a, g) => a + (IMP.map[g.key] && IMP.map[g.key] !== "SKIP" ? g.rows.length : 0), 0);
  return `<div class="modal-body">
    <p style="margin:0"><b>${esc(IMP.fileName)}</b>: ${IMP.rows.length} customers in the file${skipped ? `, ${skipped} already in the app (skipped)` : ""}.</p>
    ${groups.length ? `<p class="note" style="margin:0">Choose which company each group belongs to. You can change a single customer afterwards under Edit details.</p>
    <div class="tbl-wrap"><table><thead><tr><th>Group</th><th class="r">Customers</th><th>Examples</th><th>Company</th></tr></thead><tbody>
    ${groups.map(g => `<tr><td class="cell-main" style="white-space:nowrap">${esc(g.label)}</td><td class="r num">${g.rows.length}</td>
      <td class="cell-sub">${g.rows.slice(0, 3).map(r => esc(`${r.accountNo} ${r.name}`)).join("<br>")}</td>
      <td><select id="imp-g-${g.key}" data-impgrp="${g.key}" style="min-width:150px"><option value="">Choose…</option>
        <option value="CE" ${IMP.map[g.key] === "CE" ? "selected" : ""}>Elektronies</option><option value="CS" ${IMP.map[g.key] === "CS" ? "selected" : ""}>Sekuriteit</option><option value="SKIP" ${IMP.map[g.key] === "SKIP" ? "selected" : ""}>Don't import</option></select></td></tr>`).join("")}
    </tbody></table></div>` : `<div class="banner">Every customer in this file is already in the app. Nothing to import.</div>`}
    <div class="err">${esc(IMP.msg || "")}</div></div>
  <div class="modal-foot"><button class="btn" type="button" data-act="closeModal" ${IMP.busy ? "disabled" : ""}>Cancel</button>
    <button class="btn primary" data-act="doImport" ${ready && count && !IMP.busy ? "" : "disabled"}>${IMP.busy ? "Importing…" : `Import ${count} customer${count === 1 ? "" : "s"}`}</button></div>`;
}
function refreshImport() { const m = document.querySelector("#modal-root .modal"); if (!m) return; m.querySelectorAll(".modal-body,.modal-foot").forEach(n => n.remove()); m.insertAdjacentHTML("beforeend", importBody()); }
async function runImport() {
  const existing = new Set(S.customers.map(c => (c.accountNo || "").trim().toUpperCase()).filter(Boolean));
  const todo = IMP.rows.filter(r => (!r.accountNo || !existing.has(r.accountNo.toUpperCase())) && IMP.map[impGroup(r.accountNo)] && IMP.map[impGroup(r.accountNo)] !== "SKIP");
  IMP.busy = true; IMP.msg = ""; refreshImport();
  let done = 0;
  try {
    for (let i = 0; i < todo.length; i += 400) {
      const b = writeBatch(db);
      todo.slice(i, i + 400).forEach(r => b.set(doc(collection(db, "customers")), {
        name: r.name || r.accountNo, entity: IMP.map[impGroup(r.accountNo)], accountNo: r.accountNo, regNo: "", contactPerson: "", phone: r.phone, email: "", address: r.address, notes: "",
        createdAt: serverTimestamp(), createdBy: S.me.id, createdByName: S.me.name, importedFrom: IMP.fileName,
      }));
      await b.commit(); done += Math.min(400, todo.length - i);
      IMP.msg = `Imported ${done} of ${todo.length}…`; refreshImport();
    }
    const ce = todo.filter(r => IMP.map[impGroup(r.accountNo)] === "CE").length, cs = todo.length - ce;
    await log("customer.import", `Imported ${todo.length} customers from ${IMP.fileName} (${ce} Elektronies, ${cs} Sekuriteit)`);
    closeModal(); IMP = null; S.view = "customers"; S.custFilter = "all"; render();
    toast(`Imported ${todo.length} customers`);
  } catch (e) {
    IMP.busy = false; IMP.msg = (done ? `${done} customers were imported before the error. Choose the file again to import the rest; those already in the app are skipped. ` : "") + writeFailed(e); refreshImport();
  }
}

      foot: [["Total", "", "", mp(e.tot.open), mp(e.tot.handed), mp(e.tot.rec), mp(e.tot.close), pct(e.tot.recToDate, e.tot.toDate).toFixed(0) + "%", "", ""]],
      columnStyles: right([3, 4, 5, 6, 7]) });
  });
  let y = pdf.lastAutoTable.finalY + 9; if (y > 175) { pdf.addPage(); y = 18; }
  pdf.setFont("helvetica", "bold"); pdf.setFontSize(12); pdf.setTextColor(...INK); pdf.text("Movement in period", 14, y);
  pdf.autoTable({ ...base, startY: y + 3, head: [["Date", "Company", "Customer", "Movement", "Attorney", "Reference", "Handed over", "Recovered", "Attorney fees"]],
    body: R.movements.length ? R.movements.map(x => [fmtDate(x.date), ENT[x.code].short, x.cust.name, x.type, x.att || "", x.ref || "", x.debit ? mp(x.debit) : "", x.credit ? mp(x.credit) : "", x.fees ? mp(x.fees) : ""]) : [[{ content: "No handovers or payments in this period.", colSpan: 9 }]],
    foot: [["Total", "", "", "", "", "", mp(R.movements.reduce((a, x) => a + x.debit, 0)), mp(R.movements.reduce((a, x) => a + x.credit, 0)), mp(R.movements.reduce((a, x) => a + x.fees, 0))]],
    columnStyles: right([6, 7, 8]) });
  const n = pdf.internal.getNumberOfPages();
  for (let i = 1; i <= n; i++) { pdf.setPage(i); pdf.setFont("helvetica", "normal"); pdf.setFontSize(8); pdf.setTextColor(...MUT); pdf.text("Corcomm Blacklist · Confidential", 14, 203); pdf.text(`Page ${i} of ${n}`, W - 14, 203, { align: "right" }); }
  saveFile(fileStem() + ".pdf", pdf.output("blob"));
}

/* ---------- forms ---------- */
const val = (f, n) => (f.elements[n]?.value ?? "").trim();
let secondary = null;
const FORM = {
  async setup(f) {
    const name = val(f, "name"), email = val(f, "email"), pw = f.elements.pw.value;
    if (pw.length < 8) return formErr(f, "Use at least 8 characters for the password.");
    if (pw !== f.elements.pw2.value) return formErr(f, "The two passwords don't match.");
    busy(f, true); S.settingUp = true;
    try {
      const cred = await createUserWithEmailAndPassword(auth, email, pw);
      const uid = cred.user.uid, b = writeBatch(db);
      b.set(doc(db, "users", uid), { name, email, role: "admin", active: true, createdAt: serverTimestamp(), createdBy: uid });
      b.set(doc(db, "meta", "setup"), { done: true, at: serverTimestamp(), by: uid });
      await b.commit();
      S.settingUp = false;
      await loadMe(cred.user);
      await log("user.create", `Set up first administrator ${name}`);
    } catch (e) {
      S.settingUp = false; busy(f, false);
      formErr(f, e?.code === "permission-denied" ? "Setup has already been done. Sign in instead." : (e?.code?.startsWith("auth/") ? authErr(e) : writeFailed(e)));

  },
  async login(f) {
    busy(f, true); S.authMsg = "";
    try { await signInWithEmailAndPassword(auth, val(f, "email"), f.elements.pw.value); }
    catch (e) { busy(f, false); formErr(f, authErr(e)); }
  },
  async forgot(f) {
    busy(f, true);
    try { await sendPasswordResetEmail(auth, val(f, "email")); } catch (e) { if (!String(e?.code).includes("user-not-found") && !String(e?.code).includes("invalid-email")) { busy(f, false); return formErr(f, authErr(e)); } }
    closeModal(); toast("If that email has a login, a reset link is on its way. Check spam too.");
  },
  async customer(f) {

    if (!entity) return formErr(f, "Choose Corcomm Elektronies or Corcomm Sekuriteit.");
    const data = { name: val(f, "name"), entity, accountNo: val(f, "accountNo"), regNo: val(f, "regNo"), contactPerson: val(f, "contactPerson"), phone: val(f, "phone"), email: val(f, "email"), address: val(f, "address"), notes: val(f, "notes") };
    if (!data.name) return formErr(f, "Enter the customer's name.");
    busy(f, true);
    try {
      if (old) { await patch("customers", id, data); await log("customer.update", `Updated customer ${data.name}${old.entity !== entity ? ` (moved to ${ENT[entity].short})` : ""}`, { customerId: id }); closeModal(); toast("Customer saved"); }
      else { const nid = await put("customers", null, { ...data, createdAt: serverTimestamp(), createdBy: S.me.id, createdByName: S.me.name }); await log("customer.create", `Added customer ${data.name} (${ENT[entity].short})`, { customerId: nid });
        closeModal(); S.custId = nid; S.view = "customer"; render(); toast("Customer added. Capture the handover next."); }
    } catch (e) { formErr(f, writeFailed(e)); busy(f, false); }
  },
  async tx(f) {
    const E = f.elements, customerId = E.customerId.value, amount = round2(E.amount.value), attorney = E.attorney.value, submittedDate = E.submittedDate.value;
    if (!customerId) return formErr(f, "Choose the customer.");
    if (!(amount > 0)) return formErr(f, "Enter the amount handed over.");
    if (!ATT.includes(attorney)) return formErr(f, "Choose the attorney.");
    if (!submittedDate || submittedDate > localYMD()) return formErr(f, "Enter the date it was submitted to the attorney (not in the future).");
    busy(f, true);
    const r = doc(collection(db, "transactions"));
    let docs = [];
    try { const files = E.files?.files ? [...E.files.files] : []; if (files.length) { formErr(f, `Uploading ${files.length} document${files.length > 1 ? "s" : ""}…`); docs = await uploadFiles(files, r.id); formErr(f, ""); } }
    catch (e) { formErr(f, uploadErr(e)); busy(f, false); return; }
    try {
      const c = model().custById[customerId];
      await setDoc(r, { customerId, txDate: serverTimestamp(), amount, attorney, submittedDate, attorneyRef: val(f, "attorneyRef"), reference: val(f, "reference"), description: val(f, "description"), notes: val(f, "notes"), status: "Handed over", docs, createdBy: S.me.id, createdByName: S.me.name });
      await log("tx.create", `Handed over ${money(amount)}${val(f, "reference") ? " (" + val(f, "reference") + ")" : ""} for ${c?.name} to ${attorney}${docs.length ? `, ${docs.length} document${docs.length > 1 ? "s" : ""}` : ""}`, { customerId, transactionId: r.id });
      closeModal(); if (S.view !== "customer") { S.custId = customerId; S.view = "customer"; render(); } toast("Handover captured");
    } catch (e) { formErr(f, writeFailed(e)); busy(f, false); }
  },
  async txEdit(f) {
    const E = f.elements, t = model().txById[f.dataset.id], c = model().custById[t.customerId];
    const data = { status: E.status.value, attorney: E.attorney.value, submittedDate: E.submittedDate.value, attorneyRef: val(f, "attorneyRef"), reference: val(f, "reference"), description: val(f, "description"), notes: val(f, "notes") };
    if (isAdmin() && E.amount) { const a = round2(E.amount.value); if (!(a > 0)) return formErr(f, "Enter a valid amount."); data.amount = a; }
    if (!data.submittedDate || data.submittedDate > localYMD()) return formErr(f, "The submitted date can't be empty or in the future.");
    const changes = [];
    [["status", "status"], ["attorney", "attorney"], ["submittedDate", "submitted date"], ["attorneyRef", "attorney ref"], ["reference", "reference"], ["amount", "amount"]].forEach(([k, l]) => {
      if (k in data && String(data[k] ?? "") !== String(t[k] ?? "")) changes.push(`${l} ${k === "amount" ? money(t[k]) + " → " + money(data[k]) : (t[k] || "—") + " → " + (data[k] || "—")}`);
    });
    busy(f, true);
    try { await patch("transactions", t.id, { ...data, updatedAt: serverTimestamp(), updatedBy: S.me.id });
      if (changes.length || data.notes !== (t.notes || "") || data.description !== (t.description || "")) await log("tx.update", `Updated handover ${t.reference || ""} for ${c?.name}${changes.length ? ": " + changes.join("; ") : ""}`, { customerId: t.customerId, transactionId: t.id });
      closeModal(); toast("Handover updated"); }
    catch (e) { formErr(f, writeFailed(e)); busy(f, false); }
  },
  async pay(f) {
    const E = f.elements, m = model(), customerId = E.customerId.value, transactionId = E.transactionId.value;
    const amount = round2(E.amount.value), fees = round2(E.fees.value || 0), dateReceived = E.dateReceived.value;
    if (!customerId || !transactionId) return formErr(f, "Choose the customer and handover.");
    if (amount < 0 || fees < 0) return formErr(f, "Amounts can't be negative.");
    if (!(amount + fees > 0)) return formErr(f, "Enter the amount paid over.");
    if (!dateReceived || dateReceived > localYMD()) return formErr(f, "Enter the date received (not in the future).");
    const t = m.txById[transactionId], c = m.custById[customerId], cr = round2(amount + fees);

    try {
      await put("payments", null, { customerId, transactionId, dateReceived, amount, fees, reference: val(f, "reference"), notes: val(f, "notes"), createdAt: serverTimestamp(), createdBy: S.me.id, createdByName: S.me.name });
      const newBal = round2(m.txStats[t.id].balance - cr);
      if (newBal <= 0.004 && !CLOSED.includes(t.status)) await patch("transactions", t.id, { status: "Paid in full" });
      else if (t.status === "Handed over" || t.status === "Letter of demand") await patch("transactions", t.id, { status: "Paying (arrangement)" });
      await log("pay.create", `Received ${money(cr)} from ${t.attorney} for ${c?.name} (${t.reference || "handover"})${fees ? `, incl. ${money(fees)} attorney fees` : ""}`, { customerId, transactionId });
      closeModal(); toast(newBal <= 0.004 ? "Payment recorded. This handover is now paid in full." : "Payment recorded. Balance " + money(newBal));
    } catch (e) { formErr(f, writeFailed(e)); busy(f, false); }
  },
  async user(f) {
    const E = f.elements, id = f.dataset.id, name = val(f, "name"), role = E.role.value;
    if (!name) return formErr(f, "Enter the person's name.");
    const admins = S.users.filter(u => u.role === "admin" && u.active !== false);
    busy(f, true);
    try {
      if (id) {
        const u = S.users.find(x => x.id === id), active = E.active ? (E.active.checked || id === S.me.id) : true;
        if (u.role === "admin" && (role !== "admin" || !active) && admins.length <= 1) { busy(f, false); return formErr(f, "Keep at least one active administrator."); }
        await patch("users", id, { name, role, active });
        await log("user.update", `Updated team user ${name} (${role === "admin" ? "administrator" : "team user"}${active ? "" : ", disabled"})`);
        closeModal(); toast("User saved");
      } else {
        const email = val(f, "email"), pw = E.pw.value;
        if (pw.length < 8) { busy(f, false); return formErr(f, "Use at least 8 characters for the password."); }
        if (pw !== E.pw2.value) { busy(f, false); return formErr(f, "The two passwords don't match."); }
        if (S.users.some(u => (u.email || "").toLowerCase() === email.toLowerCase())) { busy(f, false); return formErr(f, "That email address is already on the team list."); }
        secondary ||= initializeApp(CFG, "user-admin");
        const sa = getAuth(secondary);
        const cred = await createUserWithEmailAndPassword(sa, email, pw);
        await signOut(sa);
        await setDoc(doc(db, "users", cred.user.uid), { name, email, role, active: true, createdAt: serverTimestamp(), createdBy: S.me.id });
        await log("user.create", `Added team user ${name} (${role === "admin" ? "administrator" : "team user"})`);
        closeModal(); toast("User added. Give them their email and starting password.");
      }
    } catch (e) { busy(f, false); formErr(f, e?.code?.startsWith("auth/") ? authErr(e) : writeFailed(e)); }
  },
  async myPw(f) {
    const E = f.elements;
    if (E.pw.value.length < 8) return formErr(f, "Use at least 8 characters.");
    if (E.pw.value !== E.pw2.value) return formErr(f, "The two new passwords don't match.");
    busy(f, true);
    try {
      await reauthenticateWithCredential(auth.currentUser, EmailAuthProvider.credential(auth.currentUser.email, E.cur.value));
      await updatePassword(auth.currentUser, E.pw.value);
      await log("user.password", `${S.me.name} changed their password`);
      f.reset(); busy(f, false); toast("Password changed");
    } catch (e) { busy(f, false); formErr(f, String(e?.code).match(/credential|wrong-password/) ? "Your current password is incorrect." : authErr(e)); }
  },
};

/* ---------- events ---------- */
document.addEventListener("click", e => { const a = e.target.closest("[data-act]"); if (!a || a.disabled) return; const fn = ACT[a.dataset.act]; if (fn) fn(a, e); });
document.addEventListener("submit", e => { const f = e.target; if (f.dataset.form) { e.preventDefault(); formErr(f, ""); FORM[f.dataset.form]?.(f); } });
document.addEventListener("keydown", e => { if (e.key === "Escape" && document.getElementById("modal-root").innerHTML) closeModal(); });
document.addEventListener("input", e => { const k = e.target.dataset.input; if (k) { S[k] = e.target.value; render(); } });
document.addEventListener("change", async e => {
  const t = e.target;
  if (t.dataset.impgrp) { if (IMP && !IMP.busy) { IMP.map[t.dataset.impgrp] = t.value; refreshImport(); } return; }
  if ("importFile" in t.dataset) {
    const file = t.files[0]; if (!file) return;
    try {
      const rows = readCustomerCSV(decodeText(await file.arrayBuffer()));
      IMP = { fileName: file.name, rows, map: Object.fromEntries(IMP_GROUPS.map(g => [g.key, g.def])), busy: false, msg: "" };
      refreshImport();
    } catch (err) { const m = t.closest(".modal"); m && formErr(m, err.message || "That file couldn't be read. Save it as CSV and try again."); }
    return;
  }
  if (t.dataset.rep) { S.rep[t.dataset.rep] = t.type === "checkbox" ? t.checked : t.value; if (S.rep.from > S.rep.to) S.rep.to = S.rep.from; render(); return; }
  if (t.dataset.upload) {
    const tx = model().txById[t.dataset.upload], files = [...t.files]; if (!files.length) return;
    toast(`Uploading ${files.length} document${files.length > 1 ? "s" : ""}…`);
    try { const docs = await uploadFiles(files, tx.id); const cur = model().txById[tx.id]?.docs || [];
      await patch("transactions", tx.id, { docs: [...cur, ...docs] });
      await log("doc.add", `Added ${docs.length} document${docs.length > 1 ? "s" : ""} to ${tx.reference || "handover"} for ${model().custById[tx.customerId]?.name}`, { customerId: tx.customerId, transactionId: tx.id });
      toast("Documents added"); }
    catch (err) { toast(err?.code === "permission-denied" ? writeFailed(err) : uploadErr(err), "bad"); }
  }
});

/* ---------- live data ---------- */
let unsubs = [];
function stopSubs() { unsubs.forEach(u => u()); unsubs = []; Object.keys(S.loaded).forEach(k => S.loaded[k] = false); S.users = []; S.customers = []; S.txs = []; S.pays = []; S.activity = []; S.ver++; }
function subscribe(key, loadedKey, q) {
  unsubs.push(onSnapshot(q, snap => {
    S[key] = snap.docs.map(conv);
    if (loadedKey) S.loaded[loadedKey] = true;
    if (key === "users" && S.me) {
      const me = S.users.find(u => u.id === S.me.id);
      if (!me || me.active === false) { S.authMsg = "Your login has been disabled. Ask an administrator."; signOut(auth); return; }
      S.me = me;
    }
    S.ver++; render();
  }, err => {
    console.error(key, err);
    if (err.code === "permission-denied") { S.authMsg = "Your access was removed or has been disabled. Ask an administrator."; signOut(auth); }
    else { S.err = "The records couldn't be loaded. Check your connection and reload."; S.phase = "error"; render(); }
  }));
}
function startSubs() {
  subscribe("users", "users", collection(db, "users"));
  subscribe("customers", "customers", collection(db, "customers"));
  subscribe("txs", "transactions", collection(db, "transactions"));
  subscribe("pays", "payments", collection(db, "payments"));
  subscribe("activity", null, query(collection(db, "activity"), orderBy("at", "desc"), limit(300)));
}
async function loadMe(user) {
  try {
    const snap = await getDoc(doc(db, "users", user.uid));
    const d = snap.exists() ? snap.data() : null;
    if (!d || d.active !== true) {
      S.authMsg = d ? "Your login has been disabled. Ask an administrator." : "This login doesn't have access to Corcomm Blacklist. Ask an administrator to add you.";
      await signOut(auth); return;
    }
    S.me = { id: user.uid, ...d, email: d.email || user.email };
    S.phase = "app"; S.view = "overview"; S.authMsg = "";
    startSubs(); render();
  } catch (e) {
    console.error(e); S.authMsg = "Your access couldn't be checked. Try signing in again."; await signOut(auth);
  }
}
async function boot() {
  if (!configured) { S.phase = "config"; render(); return; }
  try { await setPersistence(auth, browserSessionPersistence); } catch {}
  onAuthStateChanged(auth, async user => {
    if (S.settingUp) return;
    stopSubs(); S.me = null; closeModal();
    if (user) { S.phase = "loading"; render(); await loadMe(user); return; }
    try { const s = await getDoc(doc(db, "meta", "setup")); S.phase = s.exists() ? "login" : "setup"; }
    catch (e) { console.error(e); S.phase = "login"; if (!S.authMsg) S.authMsg = e?.code === "permission-denied" ? "Firebase security rules aren't published yet (setup guide, step 4)." : ""; }
    render();
  });
}
render();
boot();

</script>
</body>
</html>
